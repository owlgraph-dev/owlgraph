<!doctype html>
<html lang="%lang%" dir="%dir%" data-color-pref="%color-pref%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The default document title lives in the root +layout.svelte's head
         block, not here: a title set in this template is emitted before
         SvelteKit's injected head markup, so a route's own title would land
         second and be ignored by the browser.
         Never name a placeholder in a comment in this file. They are
         substituted inside comments too, and the injected markup contains
         Svelte's hydration anchors, whose closing delimiter (two dashes and
         a greater-than sign, never spelled out here for the same reason)
         closes the comment early and dumps the rest of it into the page. -->
    <meta name="description" content="owlgraph — a model-driven knowledge graph platform" />
    <!-- The software by name only: which release runs is on /-/about. -->
    <meta name="generator" content="owlgraph" />
    <link rel="license" href="/-/license" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- use-credentials: a manifest is fetched without credentials by default,
         so behind a password-protected staging proxy it is
         the one request that 401s. Same origin, no secrets in the file. -->
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />

    <meta property="og:title" content="owlgraph" />
    <meta property="og:description" content="owlgraph — a model-driven knowledge graph platform" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <!-- The social card's true dimensions: 2:1, the shape social platforms
         fill without letterboxing. -->
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />

    %sveltekit.head%
  </head>
  <body>
    <div class="app-root">%sveltekit.body%</div>
  </body>
</html>

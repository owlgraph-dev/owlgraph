# The gate in CI (docs/guides/testing.md, "CI contract"): what must be green before a
# change is merged, run on every pull request and on every push to main and to
# a release branch — plus the checks that keep the tree fit to publish
# (CONTRIBUTING.md). The gate's steps run in two
# jobs: everything below the browser in one, the end-to-end lanes in two
# shards beside it.
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a run on main or a
# release branch always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Notices, publication and advisory checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Also prepares SvelteKit's types and compiles the interface messages
      # (the prepare script; it fetches two inlang plugins from jsDelivr).
      - run: npm ci
      - name: The third-party licences are current with the lockfile
        run: node scripts/notices.mjs --check
      - name: Nothing that must not be published is tracked
        run: node scripts/check-publication.mjs
      - name: No critical advisory in the production dependencies
        run: npm audit --omit=dev --audit-level=critical

  checks:
    name: Check, unit, integration and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The test database server: the run's databases are derived from
      # owlgraph_test (tests/support/databases.ts). The image makes `user` a
      # superuser, so it may create databases from a template and the app's role.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      # The test database, for every step: the build needs a DATABASE_URL to
      # exist (SvelteKit's post-build analysis loads the server modules; nothing
      # connects), and the integration tests derive their databases from it.
      DATABASE_URL: postgres://user:password@localhost:5432/owlgraph_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The component tests run in Playwright's Chromium.
      - run: npx playwright install --with-deps chromium
      # Before any build: a fresh clone checks and tests as it is.
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The HTTP tests drive the build just made; with CI set, a missing or
      # stale build fails them instead of skipping them. The backup and
      # restore scripts reach the server inside its container, the service's
      # (tests/integration/pg.ts) — `job` is a step-level context only.
      - run: npm run test:int
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run test:component

  e2e:
    name: End-to-end, shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      DATABASE_URL: postgres://user:password@localhost:5432/owlgraph_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: The app lane, this shard's half
        run: node scripts/e2e.mjs app --skip-build -- --shard=${{ matrix.shard }}/2
      - name: The branded lane, on the first shard
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: node scripts/e2e.mjs branded --skip-build
      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            tests/e2e/.servers/
          # The servers' logs sit in a dot folder, which the action skips otherwise.
          include-hidden-files: true
          retention-days: 14

# The published image (docs/guides/branches-and-releases.md, "Publishing a
# release"; docs/guides/testing.md, "CI contract"). A pull request that touches
# what the image is built from builds it and starts the stack from it, and
# publishes nothing. A release tag does the same, then builds the image for
# both platforms and publishes it to ghcr.io: nothing else writes to the
# registry.
name: Image

on:
  pull_request:
    # What the image is built from (the build context .dockerignore admits,
    # less the tests beside the code) and what checks it. Keep the two lists
    # together.
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-compose.image.yml
      - package.json
      - package-lock.json
      - .npmrc
      - svelte.config.js
      - vite.config.ts
      - tsconfig.json
      - tsconfig.tsx.json
      - 'src/**'
      - 'static/**'
      - 'messages/**'
      - 'project.inlang/**'
      - 'scripts/**'
      - 'migrations/**'
      - schema.sql
      - LICENSE
      - PLUGIN-EXCEPTION.md
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/image.yml
      - '!**/*.test.ts'
      - '!**/e2e/**'
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a release's run always
# finishes, and a second run of the same tag waits for it.
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build the image and start the stack from it
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
      REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4
      - name: Build for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            SOURCE_URL=${{ env.SOURCE }}
            SOURCE_REVISION=${{ env.REVISION }}
          load: true
          tags: owlgraph:check
      - name: The stack starts from it and works
        run: node scripts/check-image.mjs owlgraph:check --source "$SOURCE" --revision "$REVISION"

  publish:
    name: Check the release's image, then publish it
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only job that may write to the registry, as the workflow itself: no
    # secret but its own token.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Every release tag, to tell whether this one is the highest.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Before anything is built: a tag that is no release, does not match
      # package.json or names a published version publishes nothing.
      - name: What the tag publishes
        id: release
        run: node scripts/release-image.mjs "$TAG"
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ github.token }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      # The pull request's check, on the release's own build. The push below
      # builds the same layers again from the builder's cache.
      - name: Build for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: ${{ steps.release.outputs.build-args }}
          load: true
          tags: owlgraph:check
      - name: The stack starts from it and works
        run: node scripts/check-image.mjs owlgraph:check --source "$SOURCE" --revision "$REVISION" --version "$VERSION"
        env:
          SOURCE: ${{ steps.release.outputs.source }}
          REVISION: ${{ steps.release.outputs.revision }}
          VERSION: ${{ steps.release.outputs.version }}
      - name: Build for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: ${{ steps.release.outputs.build-args }}
          load: true
          tags: owlgraph:check-arm64
      - name: Its native modules load on linux/arm64
        run: node scripts/check-image.mjs owlgraph:check-arm64 --modules-only --platform linux/arm64

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          # A registry shows a multi-platform image's annotations from its index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: ${{ steps.release.outputs.tags }}
          # GitHub names the licence without its "only"; the repository has no
          # description of its own.
          labels: |
            org.opencontainers.image.description=${{ steps.release.outputs.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.description=${{ steps.release.outputs.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build for both platforms and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.release.outputs.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # The signed attestation below is the image's provenance.
          provenance: false
      - name: Attest the build's provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
